[package]
name = "tunnel-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Tunnel client that exposes local ports at preview URLs over one outbound connection."

[[bin]]
name = "tunnel"
path = "src/main.rs"

[dependencies]
tunnel-protocol.workspace = true
anyhow.workspace = true
clap.workspace = true
futures-util.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite = { workspace = true, features = ["connect", "rustls-tls-webpki-roots"] }
tracing.workspace = true
tracing-subscriber.workspace = true
rustls.workspace = true
webpki-root-certs.workspace = true
libc = "0.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
