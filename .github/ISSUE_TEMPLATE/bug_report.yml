name: Bug report
description: Report something that does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not report security problems here; use private vulnerability reporting (see SECURITY.md).
        Never paste tokens, access links, passwords, private hostnames or other sensitive data into an issue.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Server (API, access gate, proxy, TLS)
        - Client (tunnel)
        - STUN/TURN relay and WebRTC
        - Setup, installer or release artifacts
        - Documentation
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Release version or the commit SHA you are running.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, CPU architecture, Rust version, browser and DNS provider, as relevant.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log output, with private hostnames, tokens and other secrets removed.
      render: text
