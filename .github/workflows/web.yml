name: Web UI

# Builds crates/web (Leptos, client-side rendered) into the `web-dist`
# artifact that server builds embed with `--features ui`. Called by CI and the
# release workflow, so every server binary embeds the same bytes.
on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: '3'
  CARGO_TERM_COLOR: always
  # Pinned tools: versions and SHA-256 of the upstream release archives.
  WASM_BINDGEN_VERSION: '0.2.130'
  WASM_BINDGEN_SHA256: 9687f3bb551b9f66f37ed32a40d7913a00f7962db653054e56857bc306c3227f
  BINARYEN_VERSION: '133'
  BINARYEN_SHA256: 2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (rolling branch)
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: crates/web
      - name: Install wasm-bindgen and wasm-opt (checksummed)
        shell: bash
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/tools"
          mkdir -p "$tools"
          cd "$tools"
          wb="wasm-bindgen-$WASM_BINDGEN_VERSION-x86_64-unknown-linux-musl"
          curl --proto '=https' --tlsv1.2 -fsSL -o wb.tar.gz "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$WASM_BINDGEN_VERSION/$wb.tar.gz"
          echo "$WASM_BINDGEN_SHA256  wb.tar.gz" | sha256sum --check --strict
          tar -xzf wb.tar.gz
          bn="binaryen-version_$BINARYEN_VERSION"
          curl --proto '=https' --tlsv1.2 -fsSL -o bn.tar.gz "https://github.com/WebAssembly/binaryen/releases/download/version_$BINARYEN_VERSION/$bn-x86_64-linux.tar.gz"
          echo "$BINARYEN_SHA256  bn.tar.gz" | sha256sum --check --strict
          tar -xzf bn.tar.gz
          echo "WASM_BINDGEN=$tools/$wb/wasm-bindgen" >> "$GITHUB_ENV"
          echo "WASM_OPT=$tools/$bn/bin/wasm-opt" >> "$GITHUB_ENV"
      - name: Format and lint (wasm32)
        working-directory: crates/web
        run: |
          nice -n 10 cargo fmt --check
          nice -n 10 cargo clippy --locked --release --target wasm32-unknown-unknown -- -D warnings
      # The pure modules' unit tests (limits, theme: style sheet contrast) run on the host.
      - name: Test (host)
        working-directory: crates/web
        run: nice -n 10 cargo test --locked
      - name: Build (size budget enforced)
        run: nice -n 10 crates/web/build.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: crates/web/dist/
          if-no-files-found: error
      # Rebuild and compare. A difference is reported, not fatal: toolchain
      # updates can legitimately change the bytes.
      - name: Reproducibility check (warning only)
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          (cd crates/web/dist && find . -type f -exec sha256sum {} + | sort -k2) > "$RUNNER_TEMP/first.sum"
          cargo clean --manifest-path crates/web/Cargo.toml --release --target wasm32-unknown-unknown
          nice -n 10 crates/web/build.sh > /dev/null
          (cd crates/web/dist && find . -type f -exec sha256sum {} + | sort -k2) > "$RUNNER_TEMP/second.sum"
          if ! diff -u "$RUNNER_TEMP/first.sum" "$RUNNER_TEMP/second.sum"; then
            echo "::warning::the web UI build is not byte-for-byte reproducible"
          fi
