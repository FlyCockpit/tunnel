name: Release

on:
  push:
    tags: ['v*']
  # Manual runs build and validate artifacts without attesting or publishing.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: '3'
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check version and extract release notes
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path('Cargo.toml').read_text())['workspace']['package']['version']
          if os.environ['EVENT_NAME'] == 'push' and os.environ['RELEASE_TAG'] != f'v{version}':
              raise SystemExit('Release tag must equal v + workspace version')
          changelog = Path('CHANGELOG.md').read_text()
          section = re.search(r'^## ' + re.escape(version) + r' - [^\n]+\n(.*?)(?=^## |\Z)', changelog, re.M | re.S)
          if not section or not section.group(1).strip():
              raise SystemExit('Missing changelog entry for workspace version')
          Path('dist').mkdir()
          Path('dist/release-notes.md').write_text(section.group(1).strip() + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          PY
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (rolling branch)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Generate third-party notices
        run: |
          nice -n 10 cargo install --locked --features cli cargo-about@0.9.3
          nice -n 10 cargo about generate --locked about.hbs -o dist/THIRD_PARTY_LICENSES.html
          # The web UI embedded in every server is its own workspace (wasm32).
          nice -n 10 cargo about generate --locked --manifest-path crates/web/Cargo.toml -c crates/web/about.toml \
            about.hbs -o dist/THIRD_PARTY_LICENSES_WEB_UI.html
          cp crates/web/static/ROBOTO-LICENSE.txt dist/THIRD_PARTY_LICENSES_WEB_UI_FONT.txt
          cp install.sh dist/install.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets-metadata
          path: dist/
          if-no-files-found: error

  web:
    uses: ./.github/workflows/web.yml

  build:
    needs: [prepare, web]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            # GitHub has no ubuntu-latest label for Arm runners; this matches
            # ubuntu-latest's release. The output is a static musl binary.
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (rolling branch)
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - name: Fetch the web UI build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: crates/web/dist
      - name: Install musl toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
      - name: Build release binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if [[ "$RUNNER_OS" == Linux ]]; then
            export "CC_${TARGET//-/_}=musl-gcc"
            linker_target=${TARGET//-/_}
            export "CARGO_TARGET_${linker_target^^}_LINKER=musl-gcc"
            # Every server embeds the same web UI bytes, built once by the web job.
            nice -n 10 cargo build --release --locked --target "$TARGET" -p tunnel-server --features tunnel-server/ui
            nice -n 10 cargo build --release --locked --target "$TARGET" -p tunnel-client
            cp "target/$TARGET/release/tunnel-server" "dist/tunnel-server-$TARGET"
            # Both distributed Linux binaries must be statically linked.
            for binary in tunnel-server tunnel; do
              if readelf -l "target/$TARGET/release/$binary" | grep -q INTERP; then
                echo "Expected a static musl binary: $binary" >&2
                exit 1
              fi
            done
          else
            nice -n 10 cargo build --release --locked --target "$TARGET" -p tunnel-client
          fi
          # The client ships as tunnel-<target>.tar.xz holding tunnel-<target>/tunnel,
          # which the server-served /install.sh and the Homebrew formula unpack.
          mkdir -p "pkg/tunnel-$TARGET"
          cp "target/$TARGET/release/tunnel" "pkg/tunnel-$TARGET/tunnel"
          cp LICENSE "pkg/tunnel-$TARGET/LICENSE"
          tar -C pkg -cJf "dist/tunnel-$TARGET.tar.xz" "tunnel-$TARGET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [prepare, build]
    runs-on: ubuntu-latest
    # contents to upload the release; id-token and attestations to sign build
    # provenance (keyless, no repository secret).
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-assets-*
          path: dist
          merge-multiple: true
      # /install.sh (repo and server-served) verify downloads against
      # sha256.sum and refuse to install without a matching entry; refuse to
      # publish a release that lacks any of them.
      - name: Check assets and write sha256.sum
        working-directory: dist
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            test -s "tunnel-server-$target"
          done
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl aarch64-apple-darwin x86_64-apple-darwin; do
            test -s "tunnel-$target.tar.xz"
          done
          test -s install.sh
          test -s THIRD_PARTY_LICENSES.html
          test -s THIRD_PARTY_LICENSES_WEB_UI.html
          test -s THIRD_PARTY_LICENSES_WEB_UI_FONT.txt
          mv release-notes.md "$RUNNER_TEMP/release-notes.md"
          # The Homebrew formula pins each archive's checksum; it is written
          # first so that sha256.sum covers it too.
          sha256sum -- tunnel-*.tar.xz > "$RUNNER_TEMP/archives.sum"
          ../packaging/homebrew/formula.sh "$VERSION" "$RUNNER_TEMP/archives.sum" > tunnel.rb
          ruby -c tunnel.rb
          sha256sum -- * > "$RUNNER_TEMP/sha256.sum"
          mv "$RUNNER_TEMP/sha256.sum" sha256.sum
          sha256sum --check --strict sha256.sum
      # Signed SLSA build provenance for every binary, archive and the checksum
      # file. Verify with `gh attestation verify <file> --repo FlyCockpit/tunnel`.
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/tunnel-*.tar.xz
            dist/tunnel-server-*
            dist/tunnel.rb
            dist/sha256.sum
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag \
            --title "Tunnel $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            dist/*
